name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-smoke.txt
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install smoke dependencies
        run: python -m pip install -r requirements-smoke.txt
      - name: Static and public regression checks
        run: python tests/run_checks.py
      - name: Isolated API smoke and restart persistence
        shell: powershell
        run: .\tests\smoke_runner.ps1 -Python (Get-Command python).Source
