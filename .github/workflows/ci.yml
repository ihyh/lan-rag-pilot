name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-smoke.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json
      - name: Install smoke dependencies
        run: python -m pip install -r requirements-smoke.txt
      - name: Static, unit and contract checks
        run: python tests/run_checks.py
      - name: Install UI test dependencies
        run: npm ci --prefix tests/ui
      - name: Production UI interactions
        run: npm test --prefix tests/ui
      - name: Linux HTTP smoke and persistence
        if: runner.os == 'Linux'
        run: bash tests/smoke_runner.sh
      - name: Windows HTTP smoke and persistence
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/smoke_runner.ps1 -Python (Get-Command python).Source
