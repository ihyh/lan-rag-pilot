<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>问答 · 局域网知识库助手</title>
<meta name="theme-color" content="#101d36">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="app-body">

<!-- 顶部导航 -->
<header class="topnav" id="topnav">
  <div class="nav-inner">
    <a class="brand" href="/app">
      <img class="brand-mark" src="/static/icons/icon.svg" alt="局域网知识库助手">
      <span class="brand-name">局域网知识库助手</span>
    </a>
    <button class="btn btn-icon nav-toggle" id="navToggle" type="button"
            aria-label="展开菜单" aria-expanded="false" aria-controls="navMenu"></button>
    <div class="nav-menu" id="navMenu">
      <nav class="nav-links">
        <a class="nav-link is-active" href="/app" id="appLink">问答</a>
        <a class="nav-link" href="/admin" id="adminLink" hidden>管理</a>
      </nav>
      <div class="nav-user">
        <button class="user-chip" id="userChip" type="button" aria-label="查看我的权限" title="查看我的权限"></button>
        <button class="btn btn-ghost-light" id="chgPwdBtn" type="button">修改密码</button>
        <button class="btn btn-ghost-light" id="logoutBtn" type="button">退出登录</button>
      </div>
    </div>
  </div>
</header>

<!-- 模型未就绪提示 -->
<div class="banner warn hidden" id="meNotice" role="alert"></div>

<!-- 主体：左历史 / 右问答 -->
<main class="layout-app" id="appLayout">

  <aside class="history-pane" aria-label="对话记录">
    <div class="pane-head">
      <h2 class="pane-title"><span id="historyIcon"></span>对话记录</h2>
      <div class="pane-actions">
        <button class="btn btn-danger-outline btn-sm" id="deleteChatBtn" type="button" disabled>删除选中</button>
        <button class="btn btn-outline btn-sm" id="newChatBtn" type="button">新建对话</button>
      </div>
    </div>
    <div class="history-scroll" id="historyScroll">
      <div class="history-list" id="historyList"></div>
      <div class="empty hidden" id="historyEmpty">
        <span id="historyEmptyIcon"></span>
        <p>还没有对话记录</p>
        <p class="empty-tip">在右侧输入框提出第一个问题吧</p>
      </div>
      <div class="list-loading" id="historyLoading">
        <span class="spin spin-lg"></span>
      </div>
    </div>
    <div class="pane-foot" id="historyFoot"></div>
  </aside>

  <section class="chat-pane" aria-label="问答区">
    <div class="chat-scroll" id="chatScroll">
      <div class="chat-greeting" id="chatGreeting">
        <span id="greetIcon"></span>
        <h2>开始提问</h2>
        <p>输入您的问题，助手将检索知识库文档并结合大模型作答</p>
        <p class="small">回答下方会展示引用来源，便于核对原文</p>
        <p class="small">选择提问设备，自动限定对应文档</p>
        <div class="suggestions" role="group" aria-label="选择提问设备">
          <button class="suggestion" type="button" data-device="PLM" aria-pressed="false" disabled>PLM</button>
          <button class="suggestion" type="button" data-device="PLUSPRO" aria-pressed="false" disabled>PLUSPRO</button>
          <button class="suggestion" type="button" data-device="PLUS500" aria-pressed="false" disabled>PLUS500</button>
        </div>
        <p class="small" id="deviceScopeHint" role="status">正在加载设备文档…</p>
      </div>
      <div class="messages hidden" id="messages"></div>
    </div>

    <div class="composer card">
      <details class="document-scope" id="documentScope">
        <summary id="documentScopeSummaryRow">
          <span>限定文档</span>
          <span class="document-scope-value" id="documentScopeValue">全部文档</span>
        </summary>
        <div class="document-scope-options" id="documentScopeOptions" role="group" aria-label="限定检索文档"></div>
        <p class="document-scope-tip">不勾选时检索全部文档；发送第一条问题后，本对话范围将固定。</p>
      </details>
      <textarea id="questionInput" rows="2" maxlength="2000"
                placeholder="请输入问题（Enter 发送，Ctrl+Enter 换行）"></textarea>
      <div class="composer-bar">
        <span class="composer-hint">Enter 发送 · Ctrl+Enter 换行 · <span id="questionCount">0 / 2000</span></span>
        <button class="btn btn-primary btn-send" id="sendBtn" type="button">发送</button>
      </div>
    </div>
  </section>
</main>

<script src="/static/js/common.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
