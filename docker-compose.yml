name: rag-pilot

services:
  rag:
    build:
      context: .
      dockerfile: Dockerfile
    image: rag-pilot:local
    container_name: rag-pilot
    restart: unless-stopped
    # 本服务始终使用本机构建的镜像，避免从 registry 意外拉到同名镜像。
    pull_policy: never
    env_file:
      - .env
    environment:
      # 注意：容器内的监听地址/端口由 Dockerfile 的 CMD 固定为 0.0.0.0:8088，
      # 这两个变量只影响 app/main.py 打印的启动横幅；宿主模式脚本才真正使用它们。
      RAG_HOST: "0.0.0.0"
      RAG_PORT: "8088"
      RAG_DATA_DIR: "/rag/data"
      RAG_DB_PATH: "/rag/data/rag.db"
      RAG_UPLOAD_DIR: "/rag/data/uploads"
      RAG_MODELS_DIR: "/rag/models"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    ports:
      # 只发布到回环地址：本应用不提供 TLS，直接发布到所有网卡会把明文入口
      # 暴露给整个网段。对外访问请走宿主机反向代理（见 docs/UBUNTU.md）。
      - "127.0.0.1:8088:8088"
    volumes:
      - rag_data:/rag/data
      - rag_models:/rag/models
    healthcheck:
      # 两点必须留意，否则容器会一直显示 unhealthy，而应用本身完全正常：
      # 1) 这里访问的是容器自己的回环地址，而 env_file 会把 .env 里的 HTTP_PROXY /
      #    HTTPS_PROXY 一并注入容器。urllib 默认会使用这些代理，代理无法转发回环地址
      #    时返回 502，健康检查就永远失败。所以显式绕过代理。
      # 2) 内层 timeout 必须大于 RAG_READY_PROBE_TIMEOUT_S（默认 3 秒）：/api/ready 现在
      #    会真的探测生成模型，缓存过期的那一次请求可能耗时接近该值。取 8 秒，
      #    仍小于下面外层 timeout 10s。
      test: ["CMD", "python", "-c", "import urllib.request,sys;op=urllib.request.build_opener(urllib.request.ProxyHandler({}));sys.exit(0 if op.open('http://127.0.0.1:8088/api/ready', timeout=8).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  rag_data:
  rag_models:
